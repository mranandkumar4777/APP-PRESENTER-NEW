name: Build Desktop App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18

    - name: Install Dependencies & Build
      run: |
        cd p1-app-pc
        npm install
        npm run build

    - name: Verify Build
      run: echo "Desktop build completed successfully."
